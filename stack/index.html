<script>
(function(){
var GAME_TITLE='棱光叠塔 Prism Stack';
var $=function(i){return document.getElementById(i)};
document.title=GAME_TITLE;$('title').textContent=GAME_TITLE;
var LS=localStorage;function lsg(k){try{return LS.getItem(k)}catch(e){return null}}function lss(k,v){try{LS.setItem(k,v)}catch(e){}}
var THEMES=[{n:'暮光',a:'#2B1B4A',b:'#E86A92',L:60},{n:'薄荷',a:'#A8E6CF',b:'#3D84A8',L:60},{n:'夜海',a:'#0F2027',b:'#2C5364',L:55}];
var theme=+(lsg('stack_theme')||0)%3,muted=lsg('stack_muted')==='1';
var best=+(lsg('stack_best')||0),onb=!lsg('stack_onboarded'),lockUntil=0,prevBest=0;
var cv=$('c'),ctx=cv.getContext('2d'),W,H,dpr;
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
addEventListener('resize',resize);resize();
// ---------- audio ----------
var ac=null,master=null,noiseBuf=null;
function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:0.8;master.connect(ac.destination);
 noiseBuf=ac.createBuffer(1,ac.sampleRate*0.05,ac.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}

function env(g,t,v,d){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+d);}
function osc(type,f0,f1,d,v,lp0,lp1,delay){if(!ac)return;var t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain(),out=g;o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);
 env(g,t,v,d);o.connect(g);if(lp0){var f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(lp0,t);if(lp1)f.frequency.exponentialRampToValueAtTime(lp1,t+d);g.connect(f);out=f;}out.connect(master);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,lp){if(!ac)return;var t=ac.currentTime,s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=lp;env(g,t,v,d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.01);}
var SFX={place:function(){osc('triangle',220,110,.12,.4);noise(.03,.15,800);},
 perfect:function(c){duckBGM(0.3,0.3);var f=523.25*Math.pow(2,Math.min(c,12)/12);osc('sine',f,0,.25,.35);osc('triangle',f*2,0,.25,.35*.3);},
 dualPerfect:function(){duckBGM(0.3,0.3);osc('sine',659.25,0,.3,.4);osc('triangle',659.25*2,0,.3,.12);osc('sine',880,0,.3,.35,0,0,.08);osc('triangle',880*2,0,.3,.12,0,0,.08);},
 split:function(){duckBGM(0.3,0.3);osc('sine',880,1760,.25,.3);noise(.08,.2,2400);},
 towerOut:function(){duckBGM(0.3,0.3);osc('sawtooth',400,150,.35,.32,1400,400);},
 burst:function(){duckBGM(0.3,0.3);for(var i=0;i<6;i++)osc('sine',523.25*Math.pow(2,i/12),0,.15,.34,0,0,i*.05);osc('triangle',1046.5,0,.4,.32,0,0,.3);},
 fail:function(){osc('sawtooth',300,60,.5,.3,1200,200);},
 button:function(){osc('square',880,0,.04,.15,3000);},
 brk:function(){osc('sine',440,330,.15,.2);}};
// ---------- BGM (120 BPM 4/4 layered, synthesized) ----------
var bgm={playing:false,mode:null,token:0,nextTime:0,bus:null,gains:{A:null,B:null,C:null,D:null},level:{A:-1,B:-1,C:-1,D:-1}};
function setupBGMGraph(){
 if(bgm.bus){try{bgm.bus.disconnect();}catch(e){}}
 bgm.bus=ac.createGain();bgm.bus.gain.value=1;bgm.bus.connect(master);
 var keys=['A','B','C','D'];
 for(var i=0;i<keys.length;i++){var k=keys[i];bgm.gains[k]=ac.createGain();bgm.gains[k].gain.value=0;bgm.gains[k].connect(bgm.bus);}
 bgm.level={A:-1,B:-1,C:-1,D:-1};
}
function startBGM(mode){
 if(!ac)return;
 mode=mode||'game';
 if(bgm.playing&&bgm.mode===mode&&mode==='title')return;
 bgm.token=(bgm.token||0)+1;bgm.playing=true;bgm.mode=mode;bgm.nextTime=0;
 setupBGMGraph();updateBGMLayers();schedulePhrase(bgm.token,mode);
}
function stopBGM(){
 bgm.token=(bgm.token||0)+1;bgm.playing=false;bgm.mode=null;bgm.nextTime=0;
 if(bgm.bus){try{bgm.bus.disconnect();}catch(e){}}
 bgm.bus=null;
}
function updateBGMLayers(){
 if(!ac||!bgm.gains.A)return;
 var title=bgm.mode==='title';
 // Combined layer gains stay within ~0.12-0.18. Title is layer A only.
 var a=title?0.12:0.065;
 var b=(!title&&phase!=='single')?0.04:0;
 var c=(!title&&combo>=3)?0.03:0;
 var filled=0;for(var i=0;i<6;i++)if(spectrum[i])filled++;
 var d=(!title&&filled>=5)?0.025:0;
 var next={A:a,B:b,C:c,D:d},now=ac.currentTime;
 for(var k in next){if(bgm.level[k]!==next[k]){bgm.level[k]=next[k];bgm.gains[k].gain.cancelScheduledValues(now);bgm.gains[k].gain.setTargetAtTime(next[k],now,0.06);}}
}
function duckBGM(amount,dur){
 if(!ac||!bgm.bus)return;
 var now=ac.currentTime,dip=1-(amount==null?0.3:amount);
 bgm.bus.gain.cancelScheduledValues(now);
 bgm.bus.gain.setValueAtTime(Math.max(0.0001,bgm.bus.gain.value),now);
 bgm.bus.gain.linearRampToValueAtTime(dip,now+0.02);
 bgm.bus.gain.linearRampToValueAtTime(1,now+(dur||0.3));
}
function bgmTone(dest,freq,when,dur,vel,type){
 if(!ac||!dest)return;
 var o=ac.createOscillator(),g=ac.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(freq,when);
 g.gain.setValueAtTime(0.0001,when);
 g.gain.exponentialRampToValueAtTime(Math.max(0.001,vel),when+0.02);
 g.gain.exponentialRampToValueAtTime(0.0001,when+Math.max(0.05,dur));
 o.connect(g);g.connect(dest);o.start(when);o.stop(when+dur+0.04);
}
function schedulePhrase(token,mode){
 if(!bgm.playing||token!==bgm.token||!ac)return;
 var beat=60/120,bar=beat*4,bars=mode==='title'?8:16;
 var t0=Math.max(ac.currentTime+0.06,bgm.nextTime||0);
 var A=bgm.gains.A,B=bgm.gains.B,C=bgm.gains.C,D=bgm.gains.D;
 if(mode==='title'){
  var roots=[110,110,82.41,110,130.81,110,82.41,98];
  for(var i=0;i<bars;i++){var barT=t0+i*bar;bgmTone(A,roots[i],barT,beat*1.4,0.55,'sine');if(i%2===0)bgmTone(A,roots[i]*1.5,barT+beat*2,beat*0.8,0.22,'sine');}
 }else{
  var bass=[110,87.31,130.81,98,110,87.31,146.83,98,110,87.31,130.81,98,123.47,87.31,130.81,110];
  var harm=[164.81,130.81,196,146.83,164.81,130.81,220,146.83,164.81,174.61,196,146.83,185,130.81,196,164.81];
  var penta=[261.63,293.66,329.63,392,440];
  var highs=[523.25,587.33,659.25,783.99,880,987.77,1046.5,1174.66];
  for(var b=0;b<bars;b++){
   var bt=t0+b*bar;
   bgmTone(A,bass[b],bt,beat*0.36,0.8,'sine');
   bgmTone(A,bass[b],bt+beat*2,beat*0.28,0.5,'sine');
   bgmTone(B,harm[b],bt+beat,beat*0.28,0.55,'triangle');
   bgmTone(B,harm[b],bt+beat*3,beat*0.22,0.36,'sine');
   for(var n=0;n<4;n++)bgmTone(C,penta[(b+n)%5],bt+n*beat,beat*0.24,0.36,'triangle');
   bgmTone(D,highs[b%8],bt+beat*3,beat*0.15,0.45,'sine');
   if(b%2===0)bgmTone(D,highs[(b+3)%8],bt+beat,beat*0.12,0.24,'sine');
  }
 }
 bgm.nextTime=t0+bars*bar;
 var wait=(bgm.nextTime-ac.currentTime-0.45)*1000;
 setTimeout(function(){schedulePhrase(token,mode);},Math.max(80,wait));
}
// ---------- game ----------
var ZC=0,maxCombo=0,layers=0,BH,INITW,DEP,stack,stackL,stackR,cur,curL,curR,falls,rings,score,combo,state='start',cam=0,camT=0,flash=0,last=0,failT=-1,zoom=1,zoomT=1,zoomY=0;
var phase='single',prism=null,spectrum=[0,0,0,0,0,0],burstCount=0,leftAlive=true,rightAlive=true,tutShown={};
var SPEC_HUES=[0,30,60,120,210,270];
var normalSuccessStreak=0,splitInitWidthL=0,splitInitWidthR=0,phaseOffset=0,postLossRemaining=0,deadBeamFadeL=0,deadBeamFadeR=0;
var shatterL=null,shatterR=null,splitAnim=null,spectrumFlash=0;
// ========== APPROVED REMIX RULES CONSTANTS ==========
// Perfect thresholds (px): layers 1-3: 4px; layers 4-6: 8px; layer 7+: 4px
var PERFECT_THRESHOLD_NORMAL=4,PERFECT_THRESHOLD_SYNC=8;
// Sync phase (layers 4-6): same phase both sides, 0.85× speed, 8px threshold
var SYNC_LAYERS=3,SYNC_SPEED_MULT=0.85;
// Phase offset from layer 7+: phaseDeg = min(90, 15 * (1 + floor((n-7)/3)))
// Layers 7-9: 15°, 10-12: 30°, 13-15: 45°, 16-18: 60°, 19-21: 75°, 22+: 90°
var MAX_PHASE_OFFSET_DEG=90;
// Post-loss speed reduction: next 2 layers ×0.90
var POST_LOSS_SPEED_MULT=0.90,POST_LOSS_DURATION=2;
// Burst recovery: 70% gap recovery (both alive), 60% revive (one dead)
var BURST_RECOVER_PCT=0.7,BURST_REVIVE_PCT=0.6;
// Split width: min(preTopW × 0.48, screenW × 0.28)
var SPLIT_WIDTH_RATIO=0.48,SPLIT_WIDTH_SCREEN_CAP=0.28;
// Sweep reachability: both beams must reach their tower's Perfect point
// Layout: shared base + center prism + two columns
// Left/right bars swing only above their own tower, no center overlap
// Verified: width=390, 3-Perfect split → both xL/xR inside sweep, synced dual-perfect window exists
function col(i,dl){var L=THEMES[theme].L+(dl||0);return 'hsl('+((200+i*5)%360)+',65%,'+L+'%)';}
function colH(h,dl){var L=THEMES[theme].L+(dl||0);return 'hsl('+h+',65%,'+L+'%)';}
function speedFor(n){var s=Math.min(2.5,Math.pow(1.03,n));if(n>40)s*=(1+(Math.random()*.3-.15));return s;}
function spawn(){
 if(phase==='single'){var top=stack[stack.length-1],n=stack.length-7,dir=n%2?1:-1;
  cur={x:top.x,w:top.w,y:top.y-BH,i:top.i+1,dir:dir,t:0,spd:speedFor(n-1),ease:n>20&&Math.random()<.3,h:(200+top.i*5)%360};posCur();}
 else{
  // playing = layers + 1 (the layer about to be judged)
  var playing=layers+1;
  var baseSpd=speedFor(layers);
  // Layers 4-6: 0.85× speed
  if(playing>=4&&playing<=6)baseSpd*=SYNC_SPEED_MULT;
  // Post-extinguish: next 2 spawned bars ×0.90
  if(postLossRemaining>0){baseSpd*=POST_LOSS_SPEED_MULT;postLossRemaining--;}
  // Compute phase offset for this layer: min(90, 15*(1+floor((playing-7)/3)))
  if(playing>=7){phaseOffset=Math.min(MAX_PHASE_OFFSET_DEG,15*(1+Math.floor((playing-7)/3)));}
  else{phaseOffset=0;}
  var yL=leftAlive?stackL[stackL.length-1].y-BH:0,yR=rightAlive?stackR[stackR.length-1].y-BH:0;
  if(leftAlive){var topL=stackL[stackL.length-1];curL={x:topL.x,w:topL.w,y:yL,i:topL.i+1,dir:1,t:0,spd:baseSpd,ease:playing>20&&Math.random()<.3,h:(topL.h+5)%360};}
  if(rightAlive){var topR=stackR[stackR.length-1];curR={x:topR.x,w:topR.w,y:yR,i:topR.i+1,dir:1,t:0,spd:baseSpd,ease:playing>20&&Math.random()<.3,h:(topR.h+180)%360};}
  posCurDual();}}
function posCur(){var p=cur.t%2;p=p>1?2-p:p;if(cur.ease)p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;if(cur.dir<0)p=1-p;cur.x=-cur.w*0.5+p*(W);}
function posCurDual(){
 // Both sides use same base triangle wave p, with phase offset added to right
 var tBase=(curL?curL.t:(curR?curR.t:0));
 var pBase=tBase%2;pBase=pBase>1?2-pBase:pBase;
 if((curL&&curL.ease)||(curR&&curR.ease))pBase=pBase<.5?2*pBase*pBase:1-Math.pow(-2*pBase+2,2)/2;
 
 // Right side adds phase offset (degrees → triangle time)
 var phaseFraction=phaseOffset/360;
 var pLeft=pBase;
 var tRight=tBase+phaseFraction*2;
 var pRight=tRight%2;pRight=pRight>1?2-pRight:pRight;
 if(curR&&curR.ease)pRight=pRight<.5?2*pRight*pRight:1-Math.pow(-2*pRight+2,2)/2;
 
 // Symmetric sweep: iOS construction for consistent feel
 // A = B = max(20, threshold), both sides move inward, Perfect at p=0.5
 var playing=layers+1;
 var thresh=(playing>=4&&playing<=6)?PERFECT_THRESHOLD_SYNC:PERFECT_THRESHOLD_NORMAL;
 var smallGap=16;
 if(curL&&curR){
  var xL=stackL[stackL.length-1].x,xR=stackR[stackR.length-1].x;
  var ideal=Math.max(20,thresh);
  // Clamp so 2B <= xR - xL - curL.w - smallGap (no overlap)
  var maxB=(xR-xL-curL.w-smallGap)/2;
  var B=Math.min(ideal,maxB);
  var A=B;
  // Left: curL.x = (xL - A) + p*(A + B), moves from outer toward inner
  curL.x=(xL-A)+pLeft*(A+B);
  // Right: curR.x = (xR + A) - p*(A + B), moves from outer toward inner
  curR.x=(xR+A)-pRight*(A+B);
 }else if(curL){
  var xL2=stackL[stackL.length-1].x;
  var AB=Math.max(20,thresh);
  curL.x=(xL2-AB)+pLeft*(AB+AB);
 }else if(curR){
  var xR2=stackR[stackR.length-1].x;
  var AB=Math.max(20,thresh);
  curR.x=(xR2+AB)-pRight*(AB+AB);
 }
}
function reset(){BH=Math.max(22,Math.round(H*0.04));INITW=Math.round(W*0.5);DEP=INITW*0.5;var x0=(W-INITW)/2-DEP*0.3;
 stack=[];for(var k=7;k>=0;k--)stack.push({x:x0,w:INITW,y:H*0.62+k*BH,i:0,h:200});
 stackL=[];stackR=[];falls=[];rings=[];score=0;combo=0;maxCombo=0;layers=0;cam=camT=0;failT=-1;zoom=zoomT=1;zoomY=0;phase='single';
 // Prism present from layer 1 (idle/translucent), activates on layer 3 split
 var baseY=H*0.62+7*BH;prism={x:W/2-W*0.07,w:W*0.14,y:baseY,h:BH,idle:true,activating:false,activateT:0};
 spectrum=[0,0,0,0,0,0];burstCount=0;leftAlive=true;rightAlive=true;tutShown={};
 normalSuccessStreak=0;splitInitWidthL=0;splitInitWidthR=0;phaseOffset=0;postLossRemaining=0;deadBeamFadeL=0;deadBeamFadeR=0;
 cur=null;curL=null;curR=null;shatterL=null;shatterR=null;splitAnim=null;spectrumFlash=0;
 spawn();$('score').textContent=0;updateSpectrum();}
function updateSpectrum(){var slots=document.querySelectorAll('.spec');for(var i=0;i<6;i++){slots[i].classList.toggle('lit',spectrum[i]===1);slots[i].style.background=spectrum[i]===1?'hsl('+SPEC_HUES[i]+',80%,60%)':'rgba(255,255,255,.1)';}}
function addSpectrum(h,wasLeft,wasRight){
 var next=-1;
 for(var i=0;i<6;i++)if(spectrum[i]===0){next=i;break;}
 if(next>=0){
  spectrum[next]=1;updateSpectrum();
  // Light up sound

 if(id==='theme'){theme=(theme+1)%3;lss('stack_theme',theme);applyTheme();SFX.button();return;}
 if(id==='mute'){muted=!muted;lss('stack_muted',muted?'1':'0');applyTheme();SFX.button();return;}
 if(state==='start'){start();return;}
 if(state==='over'){if(Date.now()<lockUntil)return;if(id==='again'){SFX.button();start();}else if(id==='share'){SFX.button();navigator.share({title:GAME_TITLE,text:'我在《棱光叠塔》拿到了 '+score+' 分，'+maxCombo+' 连 Perfect，光谱爆发 '+burstCount+' 次！你能叠多高？',url:location.href}).catch(function(){});}return;}
 if(state==='play'&&(cur||curL||curR))drop();}
var lt=0;document.addEventListener('touchstart',function(e){lt=Date.now();press(e)},{passive:false});
document.addEventListener('mousedown',function(e){if(Date.now()-lt<600)return;press(e)});
['touchmove','touchend','gesturestart','dblclick','contextmenu'].forEach(function(t){document.addEventListener(t,function(e){if(e.cancelable)e.preventDefault()},{passive:false})});
document.addEventListener('keydown',function(e){if(e.code==='Space'){unlock();if(state==='play')drop();else if(state==='start'||Date.now()>=lockUntil)start();}});
// ---------- render ----------
function cubeH(x,y,w,h,a,opt){var dx=DEP*0.6,dy=DEP*0.35;ctx.globalAlpha=a==null?1:a;
 var sat=opt&&opt.sat!=null?opt.sat:65,dl=opt&&opt.dl||0,L=THEMES[theme].L+dl;
 function face(add){return 'hsl('+h+','+sat+'%,'+Math.max(6,Math.min(92,L+add))+'%)';}
 ctx.fillStyle=face(-10);ctx.fillRect(x,y,w,BH);
 ctx.fillStyle=face(-20);ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+dx,y-dy);ctx.lineTo(x+w+dx,y-dy+BH);ctx.lineTo(x+w,y+BH);ctx.fill();
 ctx.fillStyle=face(0);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y-dy);ctx.lineTo(x+w+dx,y-dy);ctx.lineTo(x+w,y);ctx.fill();ctx.globalAlpha=1;}
function drawStackBlocks(st){
 var bright=splitAnim&&splitAnim.t<0.2;
 for(var j=0;j<st.length;j++){
  var b=st[j];
  if(b.extinguished)continue;
  if(bright&&j>=8)cubeH(b.x,b.y,b.w,b.h||200,1,{dl:16});
  else cubeH(b.x,b.y,b.w,b.h||200);
 }
}
function drawShatter(sh){
 if(!sh||sh.done)return;
 var k=Math.min(1,sh.t/0.15),sat=65*(1-k)+8*k,dl=-(THEMES[theme].L*0.45*k);
 for(var i=0;i<sh.cubes.length;i++){
  var c=sh.cubes[i];
  if(!c.started)cubeH(c.x,c.y,c.w,c.h,1,{sat:sat,dl:dl});
  else if(c.pieces){
   var al=Math.max(0,1-c.t/0.75);
   for(var pi=0;pi<c.pieces.length;pi++){
    var pc=c.pieces[pi];
    ctx.save();ctx.translate(pc.x+pc.w/2,pc.y+BH/2);ctx.rotate(pc.r);
    cubeH(-pc.w/2,-BH/2,pc.w,c.h,al,{sat:8,dl:-26});
    ctx.restore();
   }
  }
 }
}
function cube(x,y,w,i,a){var dx=DEP*0.6,dy=DEP*0.35;ctx.globalAlpha=a==null?1:a;
 ctx.fillStyle=col(i,-10);ctx.fillRect(x,y,w,BH);
 ctx.fillStyle=col(i,-20);ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+dx,y-dy);ctx.lineTo(x+w+dx,y-dy+BH);ctx.lineTo(x+w,y+BH);ctx.fill();
 ctx.fillStyle=col(i,0);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y-dy);ctx.lineTo(x+w+dx,y-dy);ctx.lineTo(x+w,y);ctx.fill();ctx.globalAlpha=1;}
function drawPrism(){
 if(!prism)return;
 var px=prism.x+prism.w/2,py=prism.y+prism.h/2,hw=prism.w*0.4,hh=prism.h*0.7;
 ctx.save();
 // Idle: translucent 0.75 opacity. Activating: pulse brighter. Active: full 0.85 opacity
 var baseAlpha=prism.idle?0.75:(prism.activating?0.75+(0.25*Math.sin(prism.activateT*10)):0.85);
 ctx.globalAlpha=baseAlpha;
 var grd=ctx.createLinearGradient(px-hw,py,px+hw,py);
 grd.addColorStop(0,'rgba(255,100,255,0.8)');
 grd.addColorStop(.5,'rgba(255,255,255,0.95)');
 grd.addColorStop(1,'rgba(100,200,255,0.8)');
 ctx.fillStyle=grd;
 ctx.beginPath();ctx.moveTo(px,py-hh);ctx.lineTo(px+hw,py);ctx.lineTo(px,py+hh);ctx.lineTo(px-hw,py);ctx.closePath();ctx.fill();
 ctx.strokeStyle=prism.idle?'rgba(255,255,255,0.3)':(prism.activating?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.6)');
 ctx.lineWidth=prism.activating?3:2;
 if(prism.activating){ctx.shadowColor='rgba(255,255,255,0.8)';ctx.shadowBlur=15;}
 ctx.stroke();
 ctx.globalAlpha=1;ctx.restore();
}
function drawBeam(x0,y0,x1,y1,h,a){ctx.save();ctx.globalAlpha=a||0.3;
 var grd=ctx.createLinearGradient(x0,y0,x1,y1);grd.addColorStop(0,colH(h,20));grd.addColorStop(1,colH(h,-10));ctx.strokeStyle=grd;ctx.lineWidth=3;ctx.shadowColor=colH(h,30);ctx.shadowBlur=8;
 ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();ctx.restore();}
function drawSpectrum(){
 // Horizontal capsule bar below prism/pedestal
 var barW=W*0.45,barH=18,slotW=barW/6,gap=3;
 var barX=W/2-barW/2,barY=prism.y+BH+DEP*0.5+20;
 ctx.save();
 // Dark background capsule
 ctx.fillStyle='rgba(0,0,0,0.4)';
 ctx.beginPath();
 ctx.roundRect(barX,barY,barW,barH,barH/2);
 ctx.fill();
 // Draw 6 slots left-to-right
 for(var i=0;i<6;i++){
  var x=barX+gap+i*slotW,w=slotW-gap*2,h=barH-gap*2,y=barY+gap;
  if(spectrumFlash>0&&spectrum[i]===1){
   ctx.fillStyle='#fff';
   ctx.shadowColor='rgba(255,255,255,.95)';
   ctx.shadowBlur=12;
  }else if(spectrum[i]===1){
   // Lit: colored with glow
   ctx.fillStyle=colH(SPEC_HUES[i],15);
   ctx.shadowColor=colH(SPEC_HUES[i],30);
   ctx.shadowBlur=8;
  }else{
   // Empty: dark unified cell
   ctx.fillStyle='rgba(255,255,255,0.1)';
   ctx.shadowBlur=0;
  }
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,h/2);
  ctx.fill();
 }
 ctx.restore();
}
function frame(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(spectrumFlash>0)spectrumFlash=Math.max(0,spectrumFlash-dt);
 if(bgm.playing){try{updateBGMLayers();}catch(e){}}
 if(state==='play'){
  if(phase==='single'&&cur){cur.t+=dt*cur.spd;posCur();}
  else if(phase!=='single'){
   if(curL){curL.t+=dt*curL.spd;}
   if(curR){curR.t+=dt*curR.spd;}
   posCurDual();
  }
  if(prism&&prism.activating){prism.activateT+=dt;}
  tickSplit(dt);
  shatterL=tickShatter(shatterL,dt);
  shatterR=tickShatter(shatterR,dt);
  if(deadBeamFadeL>0)deadBeamFadeL=Math.max(0,deadBeamFadeL-dt);
  if(deadBeamFadeR>0)deadBeamFadeR=Math.max(0,deadBeamFadeR-dt);
 }
 cam+=(camT-cam)*0.1;zoom+=(zoomT-zoom)*Math.min(1,dt*5);
 ctx.setTransform(dpr,0,0,dpr,0,0);var T=THEMES[theme],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,T.a);g.addColorStop(1,T.b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();
 if(failT>=0){failT+=dt;if(failT<0.6){var ang=3*Math.PI/180*Math.sin(25*failT)*Math.exp(-4*failT);ctx.translate(W/2,H/2);ctx.rotate(ang);ctx.translate(-W/2,-H/2);}}
 if(zoom<0.999){ctx.translate(W/2,ZC);ctx.scale(zoom,zoom);ctx.translate(-W/2,-ZC);}
 ctx.translate(0,cam);
 if(phase==='single'){var b0=stack[0];ctx.fillStyle=col(0,-10);ctx.fillRect(b0.x,b0.y+BH,b0.w,H*3);ctx.fillStyle=col(0,-20);ctx.beginPath();ctx.moveTo(b0.x+b0.w,b0.y);ctx.lineTo(b0.x+b0.w+DEP*.6,b0.y-DEP*.35);ctx.lineTo(b0.x+b0.w+DEP*.6,b0.y+H*3);ctx.lineTo(b0.x+b0.w,b0.y+H*3);ctx.fill();
  for(var i=0;i<stack.length;i++){var s=stack[i];cubeH(s.x,s.y,s.w,s.h||200);}
  // Draw idle prism in single phase (darker, centered on tower)
  drawPrism();
  drawSpectrum();
  // Draw beam from prism UP to moving slab
  if(cur&&state==='play'){
   var px=prism.x+prism.w/2,py=prism.y+prism.h/2;
   var cx=cur.x+cur.w/2,cy=cur.y+BH/2;
   drawBeam(px,py,cx,cy,cur.h,.3);
   cubeH(cur.x,cur.y,cur.w,cur.h);
  }
 }
 else{var base=stackL.length>0?stackL[0]:stackR[0];ctx.fillStyle=col(0,-10);ctx.fillRect(base.x,base.y+BH,W,H*3);
  drawStackBlocks(stackL);drawStackBlocks(stackR);drawShatter(shatterL);drawShatter(shatterR);
  drawPrism();
  drawSpectrum();
  if(state==='play'){var px=prism.x+prism.w/2,py=prism.y+prism.h/2;
   if(curL){var cLx=curL.x+curL.w/2,cLy=curL.y+BH/2;var alphaL=deadBeamFadeL>0?(deadBeamFadeL/0.2)*0.4:0.4;drawBeam(px,py,cLx,cLy,curL.h,alphaL);cubeH(curL.x,curL.y,curL.w,curL.h);}
   if(curR){var cRx=curR.x+curR.w/2,cRy=curR.y+BH/2;var alphaR=deadBeamFadeR>0?(deadBeamFadeR/0.2)*0.4:0.4;drawBeam(px,py,cRx,cRy,curR.h,alphaR);cubeH(curR.x,curR.y,curR.w,curR.h);}}}
 for(i=falls.length-1;i>=0;i--){var f=falls[i];f.t+=dt;f.vy+=1800*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;f.r+=f.vr*dt;
  ctx.save();ctx.translate(f.x+f.w/2,f.y+BH/2);ctx.rotate(f.r);cubeH(-f.w/2,-BH/2,f.w,f.h,Math.max(0,1-f.t/0.8));ctx.restore();if(f.t>0.8)falls.splice(i,1);}
 for(i=rings.length-1;i>=0;i--){var r=rings[i];r.t+=dt;if(r.t<0)continue;
  if(r.burst){var bp=Math.min(1,r.t/0.6),bsc=1+0.85*bp,bal=Math.max(0,1-bp);
   var sox=prism?prism.x+prism.w/2:W/2,soy=prism?prism.y+BH+DEP*0.45:H*0.62;
   ctx.save();ctx.globalAlpha=bal;for(var bi=0;bi<6;bi++){var brad=14+bp*52,bang=bi*Math.PI/3-Math.PI/2;
    ctx.fillStyle='hsl('+SPEC_HUES[bi]+',90%,70%)';ctx.beginPath();ctx.arc(sox+Math.cos(bang)*brad*bsc,soy+Math.sin(bang)*brad*bsc*0.55,7*bsc,0,Math.PI*2);ctx.fill();}ctx.restore();if(bp>=1)rings.splice(i,1);}
  else{var p=Math.min(1,r.t/0.35),e=1-Math.pow(1-p,3),sc=1+0.4*e,b=r.b,dx=DEP*.6,dy=DEP*.35,cx=b.x+(b.w+dx)/2,cy2=b.y-dy/2;
   ctx.save();ctx.translate(cx,cy2);ctx.scale(sc,sc);ctx.translate(-cx,-cy2);var fd=1-p*p,al=fd,lw=Math.max(0.01,6*fd)/sc;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+dx,b.y-dy);ctx.lineTo(b.x+b.w+dx,b.y-dy);ctx.lineTo(b.x+b.w,b.y);ctx.closePath();
   ctx.globalAlpha=al;ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=12;ctx.strokeStyle=colH(b.h||200,25);ctx.lineWidth=lw;ctx.stroke();ctx.shadowBlur=6;ctx.strokeStyle='#fff';ctx.lineWidth=lw*0.5;ctx.stroke();ctx.globalAlpha=1;ctx.restore();if(p>=1)rings.splice(i,1);}}
 ctx.restore();
 if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*.15+')';ctx.fillRect(0,0,W,H);flash-=dt*4;}
 requestAnimationFrame(frame);}
$('sbest').textContent=best?'最高分 '+best:'';applyTheme();reset();requestAnimationFrame(frame);
})();
</script></body></html>

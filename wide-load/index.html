<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>让道 · Wide Load · M1</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #1e2230;
  --text: rgba(255, 255, 255, 0.92);
  --muted: rgba(255, 255, 255, 0.62);
  --accent: #3fd0c9;
  --wide: #ffb547;
  --danger: #ff5a5f;
  --panel: #262b3c;
  --line: #3a4055;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

#app.landscape {
  flex-direction: row;
}

#chrome {
  flex-shrink: 0;
  background: var(--bg);
  /* Above #overlay so language / mute / debug stay visible and clickable. */
  z-index: 6;
}

#app.portrait #chrome {
  width: 100%;
}

#app.landscape #chrome {
  order: 2;
  width: min(28%, 320px);
  max-width: 320px;
  display: flex;
  flex-direction: column;
  padding: 16px 18px 16px 16px;
  border-left: 1px solid rgba(58, 64, 85, 0.85);
}

#board-area {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* The canvas lives here so a visible tutorial bar can take its own row. */
#board-slot {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

#app.landscape #board-area {
  order: 1;
}

canvas#game {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}

#top-bar {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  min-width: 0;
  padding: 10px 12px 0;
}

#app.landscape #top-bar {
  padding: 0;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
}
#app.landscape #top-bar h1 {
  flex: 0 0 auto;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
#app.landscape #top-bar .tools {
  width: 100%;
  margin-left: 0;
  justify-content: flex-start;
}

#top-bar h1 {
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 20px;
  letter-spacing: 0.04em;
  font-weight: 750;
}

#top-bar .tools {
  display: flex;
  flex: 0 0 auto;
  flex-shrink: 0;
  flex-wrap: nowrap;
  margin-left: auto;
  gap: 6px;
  pointer-events: auto;
  position: relative;
  z-index: 1;
}

#hud-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 16px 8px;
  font-weight: 600;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}

#app.landscape #hud-bar {
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
  padding: 28px 0 0;
  font-size: 18px;
}

#app.landscape #hud-quota {
  font-size: 22px;
  font-weight: 700;
}

#hud-quota.warn { color: var(--wide); }
#hud-quota.empty,
#hud-quota.flash { color: var(--danger); }
#hud-quota.refund { color: #fff; }
#hud-mistakes.danger { color: var(--danger); }

button.tool {
  appearance: none;
  flex-shrink: 0;
  border: 1px solid var(--line);
  background: rgba(38, 43, 60, 0.92);
  color: var(--text);
  border-radius: 999px;
  padding: 6px 10px;
  font: 600 12px/1 inherit;
  white-space: nowrap;
  cursor: pointer;
}

button.tool:active { transform: scale(0.96); }
button.tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

#overlay {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 18, 28, 0.55);
  backdrop-filter: blur(2px);
}

#overlay.hidden { display: none; }

#card {
  width: min(86%, 340px);
  background: #252a3b;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px 22px 22px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}

#card h2 {
  margin: 0 0 8px;
  font-size: 28px;
  font-weight: 800;
}

#overlay-title .title-keep {
  white-space: nowrap;
}

#card p.sub {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.45;
  overflow: visible;
  text-overflow: clip;
  white-space: normal;
  overflow-wrap: normal;
  word-break: normal;
}

#card .stats {
  display: flex;
  justify-content: space-around;
  gap: 6px;
  margin: 0 0 18px;
  font-size: 13px;
  color: var(--muted);
}

#card .stats > div {
  flex: 1 1 0;
  min-width: 0;
  overflow: visible;
  text-overflow: clip;
  white-space: nowrap;
}

#card .stats b {
  display: block;
  color: var(--text);
  font-size: 18px;
  margin-top: 2px;
}

button.primary {
  appearance: none;
  border: 0;
  background: var(--accent);
  color: #102226;
  font: 700 16px/1 inherit;
  border-radius: 999px;
  padding: 12px 28px;
  cursor: pointer;
  min-width: 160px;
}

button.primary:active { transform: scale(0.97); }

#card-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
}
#btn-boards-card {
  appearance: none;
  margin: 12px auto 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 600 14px/1 inherit;
  cursor: pointer;
  padding: 4px 10px;
}
/* Landscape start card: Start caps at 240px and sits beside Boards. Narrow cards wrap. */
#app.landscape #card-actions {
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  column-gap: 12px;
  row-gap: 8px;
}
#app.landscape #card-actions #overlay-btn {
  max-width: 240px;
  min-height: 44px;
  flex: 0 1 auto;
}
#app.landscape #card-actions #btn-boards-card {
  margin: 0;
  min-height: 44px;
  flex: 0 0 auto;
}

#tutorial-bar {
  position: relative;
  flex: 0 0 auto;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 12px 14px;
  background: rgba(15, 18, 28, 0.92);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
}

#tutorial-bar.hidden { display: none; }

#tutorial-prompt {
  margin: 0;
  flex: 1;
  text-align: left;
  font-size: 14px;
  line-height: 1.35;
}

#tutorial-skip {
  appearance: none;
  flex-shrink: 0;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  font: 700 14px/1 inherit;
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
}

#board-select-wrap {
  position: relative;
}
#board-select-wrap.hidden { display: none; }

#board-select {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
  max-height: min(52vh, 440px);
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
}

#board-scroll-hint {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 36px;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(37, 42, 59, 0), #252a3b 72%);
}
#board-scroll-hint::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 7px;
  width: 8px;
  height: 8px;
  margin-left: -5px;
  border-right: 2px solid rgba(255, 255, 255, 0.72);
  border-bottom: 2px solid rgba(255, 255, 255, 0.72);
  transform: rotate(45deg);
}

#board-select button.primary {
  position: relative;
  width: 100%;
  min-width: 0;
}

#board-select canvas.lock-icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
}

#board-select button.primary:disabled {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  cursor: default;
}

#app.compact-landscape #card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-height: calc(100dvh - 24px);
}
#app.compact-landscape #board-select-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
#app.compact-landscape #board-select {
  flex: 1 1 auto;
  min-height: 0;
  max-height: none;
  gap: 6px;
}

#debug-panel {
  position: absolute;
  right: 8px;
  top: 48px;
  z-index: 7;
  width: min(92%, 280px);
  max-height: calc(100% - 64px);
  overflow: auto;
  background: rgba(30, 34, 48, 0.96);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  font-size: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

#app.landscape #debug-panel {
  right: auto;
  left: auto;
  top: auto;
  bottom: 12px;
  /* sit inside the sidebar */
  right: 8px;
}

#debug-panel.hidden { display: none; }

#debug-panel h3 {
  margin: 0 0 8px;
  font-size: 13px;
}

#debug-panel label {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 8px;
  margin: 0 0 8px;
  color: var(--muted);
}

#debug-panel label span.val {
  color: var(--wide);
  font-variant-numeric: tabular-nums;
}

#debug-panel input[type="range"] {
  grid-column: 1 / -1;
  width: 100%;
}

#debug-panel .row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

#debug-panel .row button {
  flex: 1;
  appearance: none;
  border: 1px solid var(--line);
  background: #2c3142;
  color: var(--text);
  border-radius: 8px;
  padding: 8px 6px;
  font: 600 12px inherit;
  cursor: pointer;
}

.hidden { display: none !important; }

#fail-thumb {
  display: block;
  width: 180px;
  height: auto;
  margin: 8px auto 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #1e2230;
}
#fail-thumb.hidden { display: none; }

/* Short landscape (height <= 480, e.g. 667×375 / 844×390). Do not change normal landscape. */
#app.compact-landscape #chrome {
  width: min(34%, 220px);
  max-width: 220px;
  padding: 8px 10px 8px 8px;
}
#app.compact-landscape #top-bar {
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
}
#app.compact-landscape #top-bar h1 {
  font-size: 15px;
  flex: 0 0 auto;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#app.compact-landscape #top-bar .tools {
  flex: 0 0 auto;
  flex-wrap: nowrap;
  gap: 4px;
  flex-shrink: 0;
  justify-content: flex-start;
  width: 100%;
}
/* Portrait top bar: list and language are 44px circles, mute stays a 44px pill.
   Side padding matches, and only the board name gives up width. */
#app.portrait #top-bar {
  padding-left: 12px;
  padding-right: 12px;
  gap: 8px;
}
#app.portrait #top-bar h1 {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#app.portrait #top-bar .tools {
  gap: 8px;
  margin-left: auto;
  margin-right: 0;
  flex-shrink: 0;
}
#app.portrait #btn-boards.boards-icon,
#app.portrait #btn-lang {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#app.portrait #btn-boards.boards-icon svg {
  display: block;
  width: 20px;
  height: 20px;
}
#app.portrait #btn-mute {
  height: 44px;
  min-height: 44px;
  padding: 0 12px;
  border-radius: 999px;
  flex-shrink: 0;
}
#app.compact-landscape button.tool {
  padding: 4px 7px;
  font-size: 11px;
  white-space: nowrap;
}
#app.compact-landscape #hud-bar {
  padding: 10px 0 0;
  gap: 8px;
  font-size: 14px;
}
#app.compact-landscape #hud-quota {
  font-size: 16px;
}
#app.compact-landscape #debug-panel {
  max-height: calc(100% - 8px);
  bottom: 4px;
  width: min(96%, 240px);
  font-size: 11px;
  padding: 8px;
}
#app.compact-landscape #card {
  padding: 10px 14px 10px;
  width: min(90%, 320px);
}
/* Phone landscape: tutorial on its own row, boards 1–8 in two columns. */
#app.landscape.short-list #card {
  width: min(96%, 520px);
}
#app.landscape.short-list #board-select {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  align-content: start;
}
#app.landscape.short-list #board-select button[data-tutorial="1"] {
  grid-column: 1 / -1;
}
#app.landscape.short-list #board-select button.primary {
  padding: 12px 16px;
  font: 700 16px/1 inherit;
  min-width: 0;
}
#app.landscape.short-list #board-select .board-name {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#app.compact-landscape #card h2 { font-size: 20px; margin-bottom: 4px; }
#app.compact-landscape #card p.sub { font-size: 12px; margin: 0 0 8px; }
#app.compact-landscape #card .stats { margin: 0 0 8px; font-size: 12px; gap: 4px; }
#app.compact-landscape #card .stats b { font-size: 16px; }
#app.compact-landscape #fail-thumb { width: min(30%, 100px); margin: 4px auto 6px; }
#app.compact-landscape button.primary { padding: 8px 20px; min-width: 132px; }

#debug-panel label.seed-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
}
#debug-panel input#dbg-seed {
  grid-column: 1 / -1;
  width: 100%;
  margin-top: 2px;
  background: #1e2230;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 6px;
  font: 600 12px/1.2 inherit;
}
#debug-panel label.seed-lock {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 10px;
}

  <body>
    <div id="app" class="portrait">
      <div id="chrome">
        <div id="top-bar">
          <h1 id="title">让道</h1>
          <div class="tools">
            <button class="tool" id="btn-boards" type="button">选盘</button>
            <button class="tool" id="btn-mute" type="button" aria-pressed="false">静音</button>
            <button class="tool" id="btn-lang" type="button">EN</button>
          </div>
        </div>
        <div id="hud-bar">
          <span id="hud-quota"></span>
          <span id="hud-time"></span>
          <span id="hud-mistakes"></span>
        </div>
      </div>
      <div id="board-area">
        <div id="board-slot">
          <canvas id="game" aria-label="让道"></canvas>
        </div>
        <div id="tutorial-bar" class="hidden">
          <p id="tutorial-prompt"></p>
          <button type="button" id="tutorial-skip">跳过</button>
        </div>
        <div id="overlay">
          <div id="card">
            <h2 id="overlay-title">让道</h2>
            <p class="sub" id="overlay-sub">宽货来了，把窄巷合成宽道</p>
            <canvas id="fail-thumb" class="hidden" width="200" height="200" aria-hidden="true"></canvas>
            <div class="stats hidden" id="overlay-stats"></div>
            <div id="board-select-wrap" class="hidden">
              <div id="board-select" class="hidden"></div>
              <div id="board-scroll-hint" class="hidden" aria-hidden="true"></div>
            </div>
            <div id="card-actions">
              <button class="primary" id="overlay-btn" type="button">开始</button>
              <button class="text" id="btn-boards-card" type="button">选盘</button>
            </div>
          </div>
        </div>
      </div>
      <div id="debug-panel" class="hidden"></div>
    </div>
    <script>
"use strict";
(() => {
  // src/art/sfx.ts
  var Sfx = class {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.last = {};
    }
    unlock() {
      if (!this.ctx) this.ctx = new AudioContext();
      if (this.ctx.state === "suspended") this.ctx.resume();
    }
    tone(type, f0, f1, dur, gain, at = 0) {
      const c = this.ctx, t2 = c.currentTime + at;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t2);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t2 + dur);
      g.gain.setValueAtTime(1e-4, t2);
      g.gain.exponentialRampToValueAtTime(gain, t2 + 5e-3);
      g.gain.exponentialRampToValueAtTime(1e-4, t2 + dur);
      o.connect(g).connect(c.destination);
      o.start(t2);
      o.stop(t2 + dur + 0.02);
    }
    noise(dur, gain, lp) {
      const c = this.ctx, t2 = c.currentTime;
      const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = buf;
      f.type = "lowpass";
      f.frequency.value = lp;
      g.gain.value = gain;
      s.connect(f).connect(g).connect(c.destination);
      s.start(t2);
    }
    play(name) {
      var _a2;
      if (this.muted || !this.ctx) return;
      const now = performance.now();
      if (now - ((_a2 = this.last[name]) != null ? _a2 : -1e9) < 50) return;
      this.last[name] = now;
      switch (name) {
        case "dig":
          this.tone("triangle", 330, 330, 0.05, 0.25);
          break;
        case "fill":
          this.tone("triangle", 180, 180, 0.06, 0.25);
          break;
        case "merge":
          this.tone("sine", 440, 440, 0.07, 0.3);
          this.tone("sine", 660, 660, 0.07, 0.3, 0.12);
          break;
        case "preview":
          this.tone("sine", 880, 880, 0.04, 0.18);
          this.tone("sine", 880, 880, 0.04, 0.18, 0.16);
          break;
        case "jam":
          this.tone("square", 160, 110, 0.09, 0.25);
          this.noise(0.03, 0.25, 1200);
          break;
        case "exit":
          this.tone("sine", 784, 784, 0.15, 0.3);
          this.tone("triangle", 1568, 1568, 0.15, 0.12);
          break;
        case "expire":
          this.tone("sine", 400, 250, 0.2, 0.22);
          break;
        case "fail":
          this.tone("sawtooth", 300, 80, 0.4, 0.25);
          break;
        case "clear":
          [523, 659, 784].forEach((f, i) => this.tone("sine", f, f, 0.1, 0.3, i * 0.11));
          break;
        // v1.1 塌巷：裂纹出现时一声细碎（很轻，可能多格同时，50ms 去重已覆盖）；塌回时一声闷落
        case "crack":
          this.noise(0.05, 0.12, 3e3);
          this.tone("triangle", 900, 700, 0.04, 0.06);
          break;
        case "collapse":
          this.tone("sine", 140, 70, 0.16, 0.22);
          this.noise(0.08, 0.15, 600);
          break;
        case "fork":
          this.tone("sine", 600, 600, 0.03, 0.2);
          break;
        // 旧三档岔口，M2 起改用 flipRight / flipLeft
        // M2 岔口翻转：翻到右上行，翻到左下行
        case "flipRight":
          this.tone("sine", 600, 800, 0.04, 0.2);
          break;
        case "flipLeft":
          this.tone("sine", 800, 600, 0.04, 0.2);
          break;
        // 硬岩点不动 / 滑动时队列已满
        case "deny":
          this.tone("square", 120, 120, 0.04, 0.15);
          break;
        // 货源开始出货前 1 秒（比宽货预告轻、低）
        case "srcOn":
          this.tone("sine", 660, 660, 0.05, 0.15);
          break;
        // 沿列滑动每排进一格（音高由 playQueueTick 决定，这里是第 1 格）
        case "queueTick":
          this.tone("sine", 1e3, 1e3, 0.015, 0.08);
